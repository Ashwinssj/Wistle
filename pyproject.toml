[project]
name = "whistle-assistant"
version = "0.1.0"
description = "Offline Siri-like voice assistant using Whisper (Whistle) ASR and Needle tool calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cactus-needle>=3.2.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "psutil>=5.9",
    "watchdog>=3.0",
    "plyer>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mic = ["cactus-needle[mic]"]
android = ["kivy>=2.3", "android-activity>=0.1"]
ios = ["rubicon-objc>=0.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]